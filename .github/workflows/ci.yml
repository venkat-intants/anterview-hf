# CI — lint, type-check, test and scan every service on push and PR.
#
# The repo had no test automation before this: `sync-to-space.yml` pushed to
# Hugging Face, so a broken commit reached the live Space and was discovered
# there. This runs first and gates that — see the `ci-ok` job at the bottom,
# which is what sync-to-space.yml waits on via workflow_run. That gate is real
# now; it previously existed only in this comment.
#
# Design notes:
#   * One job per service, in parallel. Each service pins its OWN dependency
#     set (see the four requirements.txt files — that separation is
#     deliberate, per the root Dockerfile), so a single shared env would test
#     something no deployment actually runs.
#   * `shared/` is on PYTHONPATH rather than installed: it is COPY'd into each
#     image at /app/shared with PYTHONPATH=/app, and CI should exercise the
#     same import path as production.
#   * Live-service tests are excluded by MARKER (`-m "not integration"`), not
#     by directory. Most of what lives under tests/integration/ is fully
#     offline and passes in seconds; excluding the directory silently threw
#     away real coverage, including the cross-service JWT tests.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this the GITHUB_TOKEN inherits the repository
# default (commonly read+write on older repos) while these jobs execute
# third-party package installs — a compromised transitive dependency could use
# it to push. Nothing here needs more than read.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  shared:
    name: shared (intelligence + agents + auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        # shared/intelligence and shared/agents are dependency-light by design
        # (stdlib + pydantic + structlog), which is what lets all four services
        # import them. shared/auth is NOT — it needs redis/jose/bcrypt/
        # sqlalchemy — so those are installed explicitly rather than the suite
        # being left unrun, which is what happened before.
        # ruff and mypy are PINNED to the same versions the four services pin
        # in their requirements.txt. Unpinned, this job lints shared/ with
        # whatever ruff released most recently: 0.16 turns 17 new findings red
        # in code 0.7.4 considers clean, so a commit that changed nothing would
        # fail CI and block the deploy. A linter that can change its mind
        # without a code change is not a gate.
        run: |
          python -m pip install --upgrade pip
          pip install pydantic structlog pytest pytest-asyncio "ruff==0.7.4" "mypy==1.20.2"
          # shared/auth's deps. email-validator is not optional decoration:
          # the auth models use pydantic EmailStr, which raises ImportError at
          # class-construction time without it, so the whole suite fails at
          # COLLECTION rather than in a test — which is why a machine that
          # happened to have it installed could not reproduce the failure.
          pip install redis "python-jose[cryptography]" bcrypt sqlalchemy email-validator
          # shared/s3.py and shared/llm/gemini.py, added 2026-08-07 to
          # de-duplicate the seven aioboto3 constructions (SVC-1) and the three
          # Gemini callers (FB-1/FB-2). Both import at MODULE level, so their
          # suites — and, because pytest aborts the whole run on a collection
          # error, all 397 tests in this job — died on ModuleNotFoundError.
          # Same failure shape as email-validator above, verified by installing
          # exactly the list above into a clean venv and watching the run stop
          # with "Interrupted: 2 errors during collection". Nothing was
          # "passing"; nothing ran at all.
          #
          # Versions are the ones ALL FOUR services already pin, so this job
          # exercises the same library the images ship rather than whatever is
          # newest on the day. That is what lets shared/s3.py's docstring claim
          # it adds nothing to any requirements file.
          #
          # json_repair is the odd one out and is deliberate: shared/llm/gemini
          # imports it INSIDE the function because only feedback_billing and
          # interview_core ship it. Without it here the one test that drives the
          # real library against the real live failure (a raw newline inside a
          # JSON string) importorskip'd away, so the last rung of the recovery
          # ladder was gated by a stub only. Pinned to feedback_billing's
          # version — that service owns the scorecard path FB-2 is about.
          pip install "aioboto3==15.5.0" "botocore==1.40.61" "httpx==0.27.2" \
            "json_repair==0.60.1"

      - name: Lint
        # --config explicitly: run from the repo root and ruff finds no config
        # (there is no root pyproject.toml), so it silently applied its DEFAULT
        # ruleset — far weaker than the project's. The bare `ruff check shared/`
        # this replaces was passing for that reason.
        run: ruff check --config shared/pyproject.toml shared/

      - name: Type-check
        # EVERY path under shared/ that holds code is named here, and that is
        # the whole maintenance burden of this step: mypy takes explicit
        # arguments, so anything not listed is silently unchecked and looks
        # exactly like something that passed.
        #
        # metrics_auth.py, redis_factory.py, s3.py and security.py are top-level
        # MODULES, not packages, so no directory argument reaches them. llm/ and
        # observability/ are packages that simply post-date the original list —
        # s3.py and llm/ landed on 2026-08-07 with the SVC-1 / FB-1 refactors and
        # would have shipped unchecked. (shared/models/ and shared/voice/ are
        # omitted on purpose: both are an empty __init__.py and nothing else.)
        #
        # Adding a file under shared/ means adding it here.
        run: >-
          mypy shared/intelligence shared/agents shared/llm shared/observability
          shared/metrics_auth.py shared/redis_factory.py
          shared/s3.py shared/security.py
          --ignore-missing-imports

      - name: Test
        # shared/auth carries the AUTH-01 session-revocation regression suite
        # (including the logout-all TOCTOU test). It was named in this job's
        # title but never actually run.
        #
        # shared/tests added 2026-08-07: it holds the regression suites for
        # metrics_auth (the /metrics auth gate — M-6 / CWE-497) and
        # redis_factory (now the single source of the Upstash idle-drop
        # hardening for ALL FOUR services). This job enumerates paths rather
        # than collecting from the repo root, so a new directory is invisible
        # until it is listed here — both suites existed and passed locally
        # while never running in CI. Adding a shared/ test directory means
        # adding it to this line.
        #
        # Re-verified 2026-08-07: `find shared -name conftest.py -o -name
        # 'test_*.py'` finds tests in exactly four places — agents/tests,
        # auth/tests, intelligence/tests and tests/ — so this list is complete.
        # The suites added that day (shared/tests/test_s3.py,
        # test_shared_gemini.py, test_observability_pii.py) landed inside an
        # already-listed directory and needed no path change; what they DID need
        # was three packages the Install step above did not have.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest shared/intelligence shared/agents shared/auth shared/tests -q

  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # One failing service should not hide the state of the other three.
      fail-fast: false
      matrix:
        service: [data_gateway, interview_core, feedback_billing, admin_ops]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: System deps
        # portaudio is needed by interview_core's audio stack (sounddevice);
        # ffmpeg backs PyAV. Harmless no-ops for the other three.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev portaudio19-dev libgomp1 ffmpeg

      - name: Install
        working-directory: services/${{ matrix.service }}
        # requirements.txt already pins ruff and mypy; installing them
        # unpinned afterwards would silently upgrade past that pin and make
        # the lint/type gate drift with upstream releases.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: ruff check app/ tests/

      - name: Type-check
        # NON-STRICT, deliberately, and from the root mypy.ini — which is the
        # only config CI can use (see below). The per-service
        # `[tool.mypy] strict = true` blocks in each pyproject.toml are never
        # loaded by this command and are dead configuration; mypy.ini's header
        # explains why turning strict on across four services at once is not the
        # honest option today. CLAUDE.md previously said "mypy strict" and was
        # corrected on 2026-08-07 to say what actually runs.
        #
        # What IS new here is coverage: before this step, mypy ran on shared/
        # only. It would have caught a live 500 — hr_coding.py read
        # body.job_title off a model that never declared it, so every call to
        # the AI coding-question generator raised AttributeError.
        #
        # Run from the repo ROOT: services/ has an __init__.py, so invoking
        # mypy from inside a service makes it see each file under two module
        # names and refuse to check anything. Flags live in the root mypy.ini
        # so this command is reproducible verbatim on a laptop.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: mypy services/${{ matrix.service }}/app

      - name: Test
        working-directory: services/${{ matrix.service }}
        # Placeholder secrets: every service's Settings has required fields with
        # no default (database_url, jwt_secret, s3_*) and fails fast at import
        # without them. These are syntactically valid and point nowhere — unit
        # tests never open a connection.
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          EXAM_LINK_SECRET: ci-only-exam-secret-0123456789abcdef
          INTERVIEW_LINK_SECRET: ci-only-interview-secret-0123456789ab
          CONSENT_IP_SALT: ci-only-salt-0123456789abcdef
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
        # `-m "not integration"` deselects the suites that genuinely need live
        # Neon/Upstash/R2/Sarvam credentials. ALL FOUR services now use the same
        # command — exclusion is by MARKER, never by directory.
        #
        # data_gateway used to add `--ignore=tests/integration` because four
        # files in that folder need a live Postgres and none of the six carried
        # the `integration` marker. The directory ignore also threw away
        # tests/integration/test_sso_google.py and test_sso_naipunyam.py, which
        # are fully offline (31 tests, ~1.4 s) and cover the newest security
        # code in the service — the login-CSRF state binding and PKCE. They had
        # never run in CI, so sso_google.py sat at 35% and sso_naipunyam.py at
        # 34% coverage while the SSO-1 fix went in unguarded.
        #
        # The four Postgres-dependent files now carry
        # `pytestmark = pytest.mark.integration`, so the marker does the work
        # the ignore was doing and nothing else is caught by it. This restores
        # the design this file's own header describes: "Live-service tests are
        # excluded by MARKER, not by directory."
        run: |
          python -m pytest tests/ -q -m "not integration" \
            --cov=app --cov-report=term-missing --cov-report=xml

      - name: Coverage
        working-directory: services/${{ matrix.service }}
        # docs/LLD.md §15 documents "80% line coverage on services; 90% on
        # critical paths" and nothing measured it, so the number was a claim
        # rather than a gate.
        #
        # Each floor is that service's MEASURED coverage minus a margin for
        # CI-vs-local variance, not a guess and not the documented target.
        #
        # THIS TABLE, THE `case` BELOW AND docs/LLD.md §15.1 MUST AGREE, and
        # that is now CHECKED rather than requested: ops/ci/check_coverage_floors.py
        # parses all three and fails the `invariants` job if any disagree.
        #
        # The check exists because this sentence, in its previous form, did not
        # work twice running. First this block documented 55/68/83/78 while the
        # case enforced 50/62/78/72. Then LLD.md disagreed with the case on
        # three of four floors while a comment here vouched for the
        # synchronisation (code review 2026-08-07, CI-1). A comment cannot
        # enforce itself. The `case` is the only executable value; the two
        # tables describe it.
        #
        # Re-measured 2026-08-07 after the code-review remediation pass, which
        # added regression suites across all four services and un-hid 31
        # previously-ignored offline SSO tests in data_gateway:
        #
        #                   was    now    floor   margin
        #   data_gateway     60  ->  66  ->  61      5
        #   interview_core   76  ->  78  ->  73      5
        #   feedback_billing 89  ->  91  ->  86      5
        #   admin_ops        84  ->  88  ->  83      5
        #
        # data_gateway's +6 is not new tests: it is the 31 offline SSO tests
        # that `--ignore=tests/integration` had been discarding. sso_google.py
        # went 35% -> 89% and sso_naipunyam.py 34% -> 90% without a line of
        # test code being written — they were always there, just never run.
        #
        # A 5-point margin rather than 4: these numbers were measured on
        # Python 3.13 locally while CI pins 3.12, and interview_core's audio
        # stack has the most import-time platform divergence of the four.
        #
        # A ratchet, deliberately. Setting every floor to 80 today would turn the
        # build red on arrival for two services, and the honest options then are
        # "block every PR" or "switch the gate off" — both end with no gate. This
        # one fails the moment coverage DROPS, which is the property that
        # actually protects the suite, and the floors get raised as the numbers
        # climb. docs/LLD.md §15.1 records the enforced floor next to the 80/90
        # target and states plainly that only the ratchet is a defensible
        # control — the target is a destination, not a standard.
        run: |
          case "${{ matrix.service }}" in
            data_gateway)     FLOOR=61 ;;
            interview_core)   FLOOR=73 ;;
            feedback_billing) FLOOR=86 ;;
            admin_ops)        FLOOR=83 ;;
          esac
          echo "Enforcing >= ${FLOOR}% line coverage for ${{ matrix.service }}"
          python -m coverage report --fail-under="${FLOOR}"

  invariants:
    # Gates for the claims this repo makes about ITSELF — the ones that were
    # previously enforced by a comment asking the next author to be careful.
    # Both checks below exist because that failed in production twice: the
    # coverage floors drifted from their own documentation twice (CI-1), and a
    # correctly-named fail-open metric shipped with no consumer (DG-6).
    #
    # Cheap on purpose: no service dependencies, no Docker, ~10 seconds. A gate
    # that costs a minute gets deleted the first time someone is in a hurry.
    name: invariants (coverage floors + alert rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        # PyYAML is the only runtime dependency — check_coverage_floors.py is
        # stdlib. Both scripts must stay runnable on a bare checkout so a
        # contributor can reproduce a failure without installing a service's
        # requirements. ruff is PINNED to 0.7.4 like every other job here; an
        # unpinned linter can turn the build red without a code change.
        run: pip install pyyaml "ruff==0.7.4"

      - name: Lint
        # ops/ is Python that no other job covers: the `shared` job lints
        # shared/, the `services` matrix lints services/*/app and tests/, and
        # nothing looks outside those. Unlinted gate scripts are a bad trade —
        # everything else in this job trusts them.
        #
        # Honest scope: this covers ops/ only. `scripts/md_to_docs.py` is still
        # unlinted; it is not in this change's ownership and is left as a known
        # gap rather than quietly implied to be covered.
        #
        # --config explicitly, because there is no root pyproject.toml and ruff
        # would otherwise silently fall back to its (much weaker) default
        # ruleset — the exact bug the `shared` job's Lint step documents.
        run: ruff check --config shared/pyproject.toml ops/

      - name: Coverage floors agree with their documentation
        # Parses the FLOOR values out of this file's `case` block, the
        # `was -> now -> floor  margin` comment table above it, and the marked
        # table in docs/LLD.md §15.1. Fails if any of the three disagree.
        run: python ops/ci/check_coverage_floors.py

      - name: Alerting config is well-formed and still matches the code
        # ops/alerts/ is the consumer for rate_limit_check_skipped_total
        # (DG-6). This asserts the rules parse, every alert carries a `for:`,
        # a severity and a runbook, every metric they reference still exists in
        # services/*/app or shared/, and the committed scrape config carries
        # the bearer credentials /metrics now requires (M-6). promtool is the
        # authoritative PromQL validator and is documented in
        # ops/alerts/README.md; it is not run here because it needs a
        # Prometheus binary and this job must stay dependency-free.
        run: python ops/ci/check_alert_rules.py

  migrations:
    name: migrations (single linear head)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install alembic
        # alembic/env.py:23 does `from app.config import settings`, so this
        # needs everything app.config imports — pydantic, pydantic-settings and
        # structlog — not just alembic. Installing the bare scanner was enough
        # to make the job fail on ImportError before it ever read a migration.
        # Deliberately NOT `-r requirements.txt`: `alembic heads` only walks the
        # versions/ directory, and pulling the full service dependency set would
        # add ~4 minutes to a job that should take seconds.
        run: |
          python -m pip install --upgrade pip
          # -c: versions come from the service's OWN pins, never restated here.
          # Restating them is exactly how this step came to ask for
          # alembic==1.16.6 and sqlalchemy==2.0.44 — two versions that have
          # never existed on PyPI (the real pins are 1.18.4 and 2.0.50). A
          # hand-copied version in a second file is a number nothing validates
          # until the build fails; a constraints file cannot drift.
          #
          # bcrypt is in this list for a non-obvious reason: `alembic heads`
          # IMPORTS every module under versions/, and
          # 20260625_0002_..._platform_owner_hierarchy.py:36 imports bcrypt to
          # seed a password hash. Verified by grepping every migration for
          # third-party imports — alembic, sqlalchemy and bcrypt are the only
          # three. A new migration importing something else will break this job
          # until it is added here.
          pip install -c services/data_gateway/requirements.txt \
            alembic "sqlalchemy[asyncio]" pgvector bcrypt \
            pydantic pydantic-settings structlog

      - name: Assert a single linear migration head
        working-directory: services/data_gateway
        # CONTRIBUTING.md:16 has always said "CI asserts a single linear
        # migration head; a branched or duplicate-id migration fails the build",
        # and alembic/env.py cites this gate as the REASON a local check was
        # removed. Neither was true — no such step existed. Two branched
        # migrations would have merged green and then failed at deploy time,
        # which is the worst place to find out.
        #
        # DATABASE_URL is required for Settings to import but is never
        # connected to: `alembic heads` reads the versions/ directory only.
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          EXAM_LINK_SECRET: ci-only-exam-secret-0123456789abcdef
          INTERVIEW_LINK_SECRET: ci-only-interview-secret-0123456789ab
          CONSENT_IP_SALT: ci-only-salt-0123456789abcdef
        run: |
          set -euo pipefail
          heads="$(alembic heads 2>/dev/null | grep -c '(head)' || true)"
          echo "alembic heads output:"
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 migration head, found ${heads}."
            echo "Two migrations share a down_revision — the history has branched."
            echo "Fix: repoint the newer migration's down_revision at the current"
            echo "head, or add a merge revision (alembic merge -m ... <heads>)."
            exit 1
          fi
          echo "OK: single linear head."

  web:
    name: web (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        # `tsc -b`, NOT `tsc --noEmit`. web/tsconfig.json is solution-style
        # ("files": [] plus project references) and --noEmit does not follow
        # references — the old step compiled ZERO files and could never fail.
        run: npm run typecheck

      - name: Lint
        working-directory: web
        # via npm so CI and local run the identical command; the script carries
        # --max-warnings 0, which the bare `npx eslint src` here did not.
        run: npm run lint

      - name: Test
        working-directory: web
        # A vitest suite CI never ran — 262 tests when this step was added,
        # 326 across 28 files as of 2026-08-07. The number is re-measured
        # rather than left standing, because a count in a comment is exactly
        # the kind of claim this file keeps finding has outlived its code.
        run: npm test

      - name: Build
        working-directory: web
        # Same empty API bases the production image uses — every client call
        # becomes relative and Caddy fans it out (see the root Dockerfile).
        env:
          VITE_API_BASE_URL: ''
          VITE_INTERVIEW_API_URL: ''
          VITE_FEEDBACK_API_URL: ''
          VITE_ADMIN_API_URL: ''
        run: npm run build

  security:
    name: security (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        # Accepted risks live in scripts/pip-audit-ignore.txt, each with a
        # reason and an unblock condition. Anything NOT listed fails the build.
        # This is the list .trivyignore's header has always claimed was here.
        run: |
          mapfile -t IDS < <(grep -vE '^\s*#|^\s*$' scripts/pip-audit-ignore.txt)
          ARGS=()
          for id in "${IDS[@]}"; do ARGS+=(--ignore-vuln "$id"); done
          echo "${#IDS[@]} accepted-risk ids loaded"
          status=0
          for svc in data_gateway interview_core feedback_billing admin_ops; do
            echo "::group::pip-audit $svc"
            # --no-deps: these are complete freeze files, so the pinned set IS
            # the install set. Auditing them directly avoids a full dependency
            # resolution (slow, and network-flaky for interview_core's stack).
            # Loop rather than && so one service's finding does not mask the
            # other three.
            pip-audit -r "services/$svc/requirements.txt" --no-deps "${ARGS[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Audit npm dependencies
        working-directory: web
        # Production deps only — the frontend ships as a static build, so a
        # vite/vitest advisory never reaches a user. Accepted risks are
        # allowlisted with reasons in web/scripts/audit-ci.mjs.
        run: |
          npm ci
          npm run audit:ci

      - name: Compose files must not publish on all interfaces
        # Docker's short "6379:6379" form binds 0.0.0.0. Every compose file here
        # loads real cloud credentials or ships default ones, so a published
        # port means anyone on a developer's network reaches the service. This
        # class has now been fixed twice — in the root compose and in
        # infra/docker — so it gets a gate rather than a third fix.
        run: |
          # 80 and 443 are the intended public edge (Caddy in
          # docker-compose.prod.yml). Everything else must be loopback-bound.
          bad=$(grep -rnE '^\s*-\s*"(\$\{[A-Z_]+:-[0-9]+\}|[0-9]+):[0-9]+"' \
                  --include='docker-compose*.yml' . \
                | grep -vE '"(80|443):(80|443)"' || true)
          if [ -n "$bad" ]; then
            echo "::error::compose port published on all interfaces — prefix with 127.0.0.1:"
            echo "$bad"
            exit 1
          fi
          echo "All compose port mappings are loopback-bound (or the 80/443 edge)."

      - name: Scan for committed secrets
        # The gitleaks BINARY, not gitleaks/gitleaks-action. The action requires
        # a paid GITLEAKS_LICENSE for repos owned by a GitHub Organization and
        # fails the job without one — which would block every deploy for a
        # licensing reason rather than a security one. The scanner itself is
        # MIT-licensed and has no such gate.
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # --redact so a positive match never prints the secret into a public
          # build log, which would be a second disclosure.
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --redact --verbose --no-banner

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Space image
        # The sole production artefact was never built in CI — it went straight
        # from a green lint run to a force-push at the live Space, so a broken
        # Dockerfile or an unresolvable requirements pin was only ever
        # discovered in production. Build only; nothing is pushed.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: intants-space:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for CVEs
        # .trivyignore is 1.5 KB of carefully reasoned accepted-risk entries and
        # NOTHING consumed it — no Trivy step existed. A maintained ignore list
        # for a scanner that never runs reads as coverage that is not there.
        #
        # Scoped honestly: Python dependency CVEs are already gated by pip-audit
        # in the `security` job. This closes the OS/base-image half, which
        # nothing checked.
        #
        # Run via the official image rather than the marketplace action. The
        # action reference was wrong first time round (`@0.28.0`; the repo tags
        # are v-prefixed), which failed the job in 3 seconds before it scanned
        # anything. This form is also byte-for-byte the command that was
        # verified locally against a real build of this image, so what CI runs
        # and what was tested are the same thing.
        #
        # HIGH/CRITICAL only, and only where a fix exists: an unfixable CVE in a
        # base image is not something a PR author can act on, so failing the
        # build on it just teaches people to ignore the job.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/work -w /work \
            -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2 \
            aquasec/trivy:0.73.0 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile .trivyignore \
              --scanners vuln \
              --exit-code 1 \
              --quiet \
              intants-space:ci

  ci-ok:
    # The single required status. sync-to-space.yml keys its workflow_run gate
    # on this workflow's conclusion, and that is only `success` when every job
    # succeeded — this job makes it explicit and gives branch protection one
    # check to require.
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [shared, services, invariants, migrations, web, security, docker]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          echo "shared=${{ needs.shared.result }}"
          echo "services=${{ needs.services.result }}"
          echo "invariants=${{ needs.invariants.result }}"
          echo "migrations=${{ needs.migrations.result }}"
          echo "web=${{ needs.web.result }}"
          echo "security=${{ needs.security.result }}"
          echo "docker=${{ needs.docker.result }}"
          if [ "${{ needs.shared.result }}" != "success" ] \
            || [ "${{ needs.services.result }}" != "success" ] \
            || [ "${{ needs.invariants.result }}" != "success" ] \
            || [ "${{ needs.migrations.result }}" != "success" ] \
            || [ "${{ needs.web.result }}" != "success" ] \
            || [ "${{ needs.security.result }}" != "success" ] \
            || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed — deploy is blocked."
            exit 1
          fi
          echo "All CI jobs succeeded."
