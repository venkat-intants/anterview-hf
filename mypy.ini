# Root mypy config — the one CI uses for the per-service type-check.
#
# Why a root config at all: CI runs mypy from the repo root (it must, because
# `services/` has an __init__.py, so checking a service from inside its own
# directory makes mypy see every file under two module names and refuse to
# check anything). From the root, mypy found NO config — there was no root
# pyproject.toml — and silently used its defaults. The per-service
# `[tool.mypy] strict = true` blocks were never applied by CI, so "mypy strict"
# in CLAUDE.md was aspirational.
#
# This file makes the invocation explicit and reproducible:
#   mypy services/<svc>/app
#
# Note the deliberate gap: this is NOT strict, here or anywhere else in the
# repo. Turning strict on across four services at once would produce hundreds
# of errors and the honest options were "block every PR" or "ignore the step".
# A non-strict gate that actually runs and actually fails is worth more than a
# strict one that is switched off — and it already caught a live 500
# (hr_coding.py reading body.job_title off a model that never declared it).
# Tightening it per-service is tracked work, not a silent omission. CLAUDE.md
# was corrected on 2026-08-07 to say this rather than "mypy strict".

[mypy]
python_version = 3.12
ignore_missing_imports = True
explicit_package_bases = True
# shared/ has its own dedicated CI job (ruff + mypy + tests) — also non-strict:
# that job runs `mypy shared/... --ignore-missing-imports` with no config file,
# i.e. mypy's defaults. Without follow_imports=silent here, every service
# re-reports the same shared/ errors and the signal about the service's OWN
# code drowns.
follow_imports = silent
plugins = pydantic.mypy

# Settings classes are populated from the environment, so mypy's "Missing named
# argument" on `Settings()` is a false positive: the fields are required at
# RUNTIME (that is the point — the app must fail fast without them) but never
# passed positionally in code.
[mypy-app.config]
disable_error_code = call-arg
