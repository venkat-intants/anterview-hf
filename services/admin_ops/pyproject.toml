[tool.poetry]
name = "admin-ops"
version = "0.1.0"
description = "Admin dashboard APIs, analytics, ops"
authors = ["Intants <support@intants.com>"]
readme = "README.md"
package-mode = false

# ---------------------------------------------------------------------------
# NOT THE INSTALL SOURCE. `requirements.txt` is authoritative and is the only
# thing that ever gets installed: the dev .venv, this service's Dockerfile, and
# the CI matrix leg all run `pip install -r requirements.txt`. Nothing in the
# repo runs `poetry install`, and the poetry.lock beside this file is an unused
# artefact.
#
# So this block is METADATA, not a contract — it lists the direct dependencies
# worth naming in prose, with the runtime-parity pins that carry a reason. It is
# NOT a complete import inventory. Verified 2026-08-07 against the actual
# imports under app/ and tests/, these are imported and pinned in
# requirements.txt but absent here: botocore (S3 error handling in
# app/s3_client.py), pydantic (imported directly; only arrives via
# fastapi/pydantic-settings here), plus sentry-sdk and json_repair, which reach
# this service through `shared`. That is fine and expected; it is only a problem
# if you believe this block is the truth. Add a dependency to requirements.txt;
# add it here only if a future reader needs the *reason* for it.
# (Closes code-review finding DEP-1.)
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic-settings = "^2.6"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
redis = "^5.2"
python-jose = {extras = ["cryptography"], version = "^3.3"}
# Transitive pin: match the requirements.txt runtime stack (bump both together)
cryptography = "48.0.1"
# app/main.py exposes /metrics via prometheus_client directly
prometheus-client = ">=0.20,<1"
httpx = "^0.27"
structlog = "^24.4"
# app/s3_client.py (DPDP erasure executor) deletes R2 objects via aioboto3
aioboto3 = ">=13.0"
shared = {path = "../../shared", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"
mypy = "^1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../.."]

# No [tool.mypy] here on purpose. CI type-checks from the REPO ROOT
# (`mypy services/admin_ops/app`), because services/ has an __init__.py and
# running mypy from inside a service makes it see every file under two module
# names. From the root mypy loads /mypy.ini and never looks at this file, so a
# `[tool.mypy] strict = true` block here was dead config asserting a contract
# nothing enforced — and its python_version = "3.11" contradicted the 3.12 CI
# pin as well. Change type-checking behaviour in /mypy.ini; per-service
# tightening goes there as a [mypy-app.*] section.
# (Closes code-review finding XS-09 / CICD-4 / DEP-3.)
