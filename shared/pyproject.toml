[tool.poetry]
name = "shared"
version = "0.1.0"
description = "Shared Pydantic models, auth providers, LLM adapters, voice adapters, observability"
authors = ["Intants <support@intants.com>"]
packages = [{include = "shared", from = ".."}]

# ---------------------------------------------------------------------------
# NOT AN INSTALL SOURCE, and shared/ has no requirements.txt of its own. It is
# never pip-installed: each service .venv gets it via a .pth file, and each
# Dockerfile COPYs it into the image. Its dependencies are therefore satisfied
# by whichever service imports it — that is why the rule in schema.py exists
# ("stdlib + pydantic + structlog only, so all four service images can import
# this").
#
# Which makes this block METADATA describing the INTENDED contract, not the
# actual import set. Verified 2026-08-07: shared/ additionally imports
# aioboto3, bcrypt, botocore, fastapi, httpx, json_repair, prometheus_client,
# redis, sentry_sdk, sqlalchemy and starlette. Those live in the optional
# sub-packages (shared/db, shared/s3, shared/observability,
# shared/http_observability, shared/auth) that a service opts into, and every
# service's requirements.txt pins them — nothing is missing at runtime. The
# dependency-light rule still binds shared/intelligence and shared/agents
# specifically, which is where it is load-bearing.
#
# Do not "fix" this by adding those to the block: that would read as permission
# to import them from anywhere under shared/.  (Closes code-review finding
# DEP-1 for shared/.)
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
python = "^3.11"
pydantic = {extras = ["email"], version = "^2.9"}
python-jose = {extras = ["cryptography"], version = "^3.3"}
structlog = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Same ruleset the four services use. Without this block shared/ was linted
# with ruff's DEFAULT rules (E+F only) — far weaker than the code that imports
# it — and pointing `--config` at this file changed nothing, because there was
# no [tool.ruff] here to find. shared/ is the code every service depends on;
# it should be held to at least the same bar, not a lower one.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
# E501: long descriptive strings in the taxonomy/roster prompt tables.
ignore = ["E501"]

# Tests under shared/ (shared/auth/tests, shared/intelligence/tests) are run
# with a service's venv, e.g.:
#   services/interview_core/.venv/Scripts/python -m pytest ../../shared
# pytest resolves rootdir from the test path upwards and stops at the first
# file carrying [tool.pytest.ini_options] — without this block it walked past
# shared/ to the repo root, found no config, and every async test errored with
# "async def functions are not natively supported".
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
