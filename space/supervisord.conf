; =============================================================================
; Supervisord — six processes inside the single HF Space container.
; All service env not set here is inherited from the container environment
; (defaults exported by space/entrypoint.sh; secrets from Space settings).
; Program-level environment= entries are per-service OVERRIDES only.
; =============================================================================

# NOTE: no user= directive — the container itself already runs as appuser
# (USER in the Dockerfile); supervisord only accepts user= when started as root.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------------------
; Caddy — the ONLY listener HF exposes (app_port 7860). Serves the built
; frontend and fans out API paths to the loopback services.
; ---------------------------------------------------------------------------
[program:caddy]
command=/usr/local/bin/caddy run --config /app/space/Caddyfile --adapter caddyfile
directory=/app
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:data_gateway]
command=/venvs/dg/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8002
directory=/app/services/data_gateway
environment=PORT="8002",SERVICE_NAME="data_gateway",S3_BUCKET_NAME="%(ENV_S3_BUCKET_DG)s"
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:interview_core]
command=/venvs/ic/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/services/interview_core
environment=PORT="8001",SERVICE_NAME="interview_core",S3_BUCKET_NAME="%(ENV_S3_BUCKET_AUDIO)s"
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:feedback_billing]
command=/venvs/fb/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8003
directory=/app/services/feedback_billing
environment=PORT="8003",SERVICE_NAME="feedback_billing",S3_BUCKET_NAME="%(ENV_S3_BUCKET_SCORECARDS)s"
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:admin_ops]
command=/venvs/ao/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8004
directory=/app/services/admin_ops
environment=PORT="8004",SERVICE_NAME="admin_ops",S3_BUCKET_NAME="%(ENV_S3_BUCKET_AUDIO)s"
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; LiveKit worker — conducts the live interviews (no HTTP port). livekit-agents
; spawns one job subprocess per interview: stopasgroup ensures SIGTERM reaches
; them; stopwaitsecs mirrors docker-compose.prod.yml's drain math
; (120 s drain + ~53 s worst-case scoring close + buffer).
; ---------------------------------------------------------------------------
[program:interview_worker]
command=/venvs/ic/bin/python -m app.worker.interview_worker start
directory=/app/services/interview_core
environment=SERVICE_NAME="interview_core",S3_BUCKET_NAME="%(ENV_S3_BUCKET_AUDIO)s"
autorestart=true
priority=30
stopsignal=TERM
stopwaitsecs=210
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
