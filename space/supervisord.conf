; =============================================================================
; Supervisord — six processes inside the single HF Space container.
; All service env not set here is inherited from the container environment
; (defaults exported by space/entrypoint.sh; secrets from Space settings).
; Program-level environment= entries are per-service OVERRIDES only.
; =============================================================================

# NOTE: no user= directive — the container itself already runs as appuser
# (USER in the Dockerfile); supervisord only accepts user= when started as root.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------------------
; FATAL handler. autorestart=true is not a forever guarantee: after
; startretries consecutive failed starts supervisord marks the program FATAL
; and never touches it again, so a Space with one rejected secret would keep
; serving :7860 with that service permanently 502. This listener ends
; supervision on the first FATAL so the container exits and HF restarts it.
; The retry counts below are deliberately bounded — supervisord's BACKOFF delay
; grows by a second per failed spawn with no ceiling, so a huge startretries
; degenerates into hour-long silent waits, which is worse than a loud restart.
;
; stdout is the event-protocol channel here, NOT a log: it must not be
; redirected, which is why this block alone omits stdout_logfile/redirect_stderr.
; ---------------------------------------------------------------------------
[eventlistener:fatal_abort]
command=/venvs/tools/bin/python -u /tmp/fatal_abort.py
events=PROCESS_STATE_FATAL
autorestart=true
priority=1
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Caddy — the ONLY listener HF exposes (app_port 7860). Serves the built
; frontend and fans out API paths to the loopback services.
; ---------------------------------------------------------------------------
[program:caddy]
command=/usr/local/bin/caddy run --config /app/space/Caddyfile --adapter caddyfile
directory=/app
autorestart=true
; caddy binds in well under a second; anything that dies inside 5 s is a config
; or port error that retrying cannot fix, so let it reach FATAL and abort.
startsecs=5
startretries=10
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:data_gateway]
command=/venvs/dg/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8002
directory=/app/services/data_gateway
environment=PORT="8002",SERVICE_NAME="data_gateway",S3_BUCKET_NAME="%(ENV_S3_BUCKET_DG)s"
autorestart=true
startsecs=10
startretries=10
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:interview_core]
command=/venvs/ic/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/services/interview_core
environment=PORT="8001",SERVICE_NAME="interview_core",S3_BUCKET_NAME="%(ENV_S3_BUCKET_AUDIO)s"
autorestart=true
startsecs=10
startretries=10
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:feedback_billing]
command=/venvs/fb/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8003
directory=/app/services/feedback_billing
; S3_SCORECARD_BUCKET, not S3_BUCKET_NAME. This service declares
; `s3_scorecard_bucket` and NO `s3_bucket_name`, and its Settings sets
; extra="ignore" — so the old S3_BUCKET_NAME here was dropped without a log line
; and the bucket only ever came from the field default. It read like it pointed
; the scorecard PDFs somewhere; it pointed nothing anywhere (CICD-7).
; ops/ci/check_env_parity.py now fails the build on this class of typo.
environment=PORT="8003",SERVICE_NAME="feedback_billing",S3_SCORECARD_BUCKET="%(ENV_S3_BUCKET_SCORECARDS)s"
autorestart=true
startsecs=10
startretries=10
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:admin_ops]
command=/venvs/ao/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8004
directory=/app/services/admin_ops
; S3_BUCKET_NAME here is the RESUME/JD uploads bucket (what data_gateway writes
; and the DPDP erasure executor purges) — NOT the audio bucket. Pointing this at
; S3_BUCKET_AUDIO made erasure look in the wrong bucket and silently skip
; resume/JD deletion (DPDP §12).
environment=PORT="8004",SERVICE_NAME="admin_ops",S3_BUCKET_NAME="%(ENV_S3_BUCKET_DG)s"
autorestart=true
startsecs=10
startretries=10
priority=20
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; LiveKit worker — conducts the live interviews (health endpoint on
; 127.0.0.1:8081, loopback-only, not routed by caddy). livekit-agents
; spawns one job subprocess per interview: stopasgroup ensures SIGTERM reaches
; them; stopwaitsecs mirrors docker-compose.prod.yml's drain math
; (120 s drain + ~53 s worst-case scoring close + buffer).
; ---------------------------------------------------------------------------
[program:interview_worker]
command=/venvs/ic/bin/python -m app.worker.interview_worker start
directory=/app/services/interview_core
environment=SERVICE_NAME="interview_core",S3_BUCKET_NAME="%(ENV_S3_BUCKET_AUDIO)s"
; Set to false by entrypoint.sh when the LiveKit credentials are incomplete —
; the worker cannot start without them, and starting it anyway would exhaust
; startretries and hand the whole container to the FATAL handler above over a
; feature the entrypoint deliberately treats as optional.
autostart=%(ENV_INTERVIEW_WORKER_AUTOSTART)s
autorestart=true
startsecs=15
startretries=10
priority=30
stopsignal=TERM
stopwaitsecs=210
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
