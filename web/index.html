<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AntHire — AI-powered voice interview platform" />
    <meta name="theme-color" content="#f5f7fa" />
    <!-- Two axes, both applied before React mounts so neither flashes:
         `data-mode`  = light | dark, the two designs  (lib/useThemeMode.ts)
         `data-theme` = the signal accent within a mode (components/ThemeToggle)
         `.dark` mirrors data-mode because shadcn's `dark:` variants key off the
         class while the palettes key off the attribute — they must agree. -->
    <script>
      (function () {
        var root = document.documentElement;
        var mode = 'light';
        var accent = 'blue';
        try {
          if (localStorage.getItem('anthire:mode') === 'dark') mode = 'dark';
          var t = localStorage.getItem('intants:theme');
          // 'purple' is the old stored name for violet.
          if (t === 'black' || t === 'violet') accent = t;
          else if (t === 'purple') accent = 'violet';
        } catch (e) {
          /* storage blocked — defaults stand */
        }
        root.setAttribute('data-mode', mode);
        root.classList.toggle('dark', mode === 'dark');
        root.style.colorScheme = mode;
        root.style.backgroundColor = mode === 'dark' ? '#090d16' : '#f5f7fa';
        root.setAttribute('data-theme', accent);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts are self-hosted (src/fonts.css, files in public/fonts): Inter for
         body text, Plus Jakarta Sans for headings. No page load contacts a
         third party for type. The two latin files are preloaded because every
         first paint needs them; `crossorigin` is required on a font preload
         even same-origin, or the browser fetches the file twice. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>AntHire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
